services:
  - type: web
    name: cineverse-ai
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: cineverse-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/cineverse.sqlite
      - key: TMDB_READ_ACCESS_TOKEN
        sync: false
